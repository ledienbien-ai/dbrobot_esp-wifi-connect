<!DOCTYPE html>
<html lang="vi">
<head>
    <title>DB-Robot – Khởi động lại thiết bị</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <style>
        /* ══════════════════════════════════════════════════════════════
           BẢNG MÀU DB-ROBOT — cùng một bộ token với https://dbrobot.vn
           và với wifi_configuration.html. Sửa một bên thì sửa cả hai,
           người dùng nhìn thấy hai trang này nối tiếp nhau trong vài giây.
           ══════════════════════════════════════════════════════════════ */
        :root {
            --blue: #1462E8;
            --blue-deep: #0B3FA8;
            --blue-light: #E8F0FE;
            --blue-bright: #2C7BF2;
            --ink: #06214A;
            --ink-soft: #46596F;
            --line: #DCE6F5;
            --signal: #00A6A6;
            --sky: #F4F8FF;
            --white: #FFFFFF;
            --radius: 16px;
            --shadow-md: 0 4px 10px rgba(6, 33, 74, .07), 0 18px 40px rgba(6, 33, 74, .09);
        }

        * {
            box-sizing: border-box;
        }

        /* ⚠ Không nạp phông từ Internet: lúc trang này hiện ra, điện thoại
           vẫn đang nối vào điểm phát của robot và chưa ra được mạng. */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1000px 440px at 50% -8%, var(--blue-light) 0%, rgba(232, 240, 254, 0) 70%),
                var(--sky);
            -webkit-text-size-adjust: 100%;
        }

        /* ===== HEADER ===== */
        .brand-header {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px 8px 8px;
            border-radius: 999px;
            background: var(--white);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-md);
            max-width: calc(100vw - 24px);
        }

        /* Logo thật, nhúng bằng data: URI — component chỉ phục vụ HTML,
           không có đường dẫn nào trả file ảnh (wifi_configuration_ap.cc). */
        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--white);
            box-shadow: 0 2px 7px rgba(6, 33, 74, .18);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== LAYOUT ===== */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* ===== Dấu tích ===== */
        .checkmark-wrapper {
            position: relative;
            margin-bottom: 26px;
            margin-top: 56px;
        }

        .checkmark-glow {
            position: absolute;
            inset: 6px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(0, 166, 166, .18), transparent 70%);
            filter: blur(10px);
            opacity: 0;
            animation: glow-in 0.7s ease-out 0.2s forwards;
        }

        @keyframes glow-in {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }

        .checkmark {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 10px 26px rgba(0, 166, 166, .28));
            transform-origin: center;
            animation: pop-in 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes pop-in {
            0%   { transform: scale(0.7); opacity: 0; }
            60%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke: var(--signal);
            fill: none;
            animation: stroke-animation 0.6s ease-out forwards;
        }

        .checkmark__check {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke-width: 3;
            stroke: var(--signal);
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            animation: check-animation 0.4s ease-out 0.6s forwards;
        }

        @keyframes stroke-animation { 100% { stroke-dashoffset: 0; } }
        @keyframes check-animation  { 100% { stroke-dashoffset: 0; } }

        /* ===== Hộp thông báo ===== */
        .message-box {
            position: relative;
            overflow: hidden;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 22px 26px;
            box-shadow: var(--shadow-md);
            max-width: 380px;
            width: 100%;
            animation: fadein 0.6s ease-out 0.2s both;
        }

        /* Vệt xanh trên đỉnh hộp — đúng dải chuyển màu thanh tiêu đề
           của dbrobot.vn, dùng lại y như thẻ bên trang cấu hình. */
        .message-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(100deg, var(--blue-deep) 0%, var(--blue) 68%, var(--blue-bright) 100%);
        }

        @keyframes fadein {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message {
            font-size: 17px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.5;
        }

        /* Chốt bề ngang bằng một chữ số để con số đếm lùi không làm cả
           dòng nhảy qua nhảy lại mỗi giây (nhất là khi .count-pulse đang
           phóng to thu nhỏ nó). 1em là vừa khít một chữ số. */
        .count {
            display: inline-block;
            min-width: 1em;
            text-align: center;
            font-weight: 800;
            color: var(--blue);
        }

        .sub {
            margin-top: 9px;
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--ink-soft);
        }

        .hint {
            margin-top: 11px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            line-height: 1.6;
            color: #7D8CA3;
        }

        .count-pulse {
            animation: pulse 1s ease-out infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* Người dùng bật "giảm chuyển động" thì bỏ hết nhịp đập và nảy —
           nội dung vẫn hiện đầy đủ, chỉ là không nhúc nhích. */
        @media (prefers-reduced-motion: reduce) {
            .checkmark,
            .count-pulse,
            .message-box,
            .checkmark-glow {
                animation: none;
            }
            .checkmark__circle,
            .checkmark__check {
                stroke-dashoffset: 0;
                animation: none;
            }
            .checkmark-glow { opacity: 1; }
        }

        /* ===== Màn hình hẹp ===== */
        @media (max-width: 480px) {
            .checkmark { width: 112px; height: 112px; }
            .message-box { max-width: 320px; padding: 18px 18px; }
            .brand-title { font-size: 13px; }
        }
    </style>
</head>

    <div class="container">

        <!-- Checkmark animation -->
        <div class="checkmark-wrapper">
            <div class="checkmark-glow"></div>
            <svg class="checkmark" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25"/>
                <path class="checkmark__check" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>

        <!-- Message -->
        <div class="message-box">
            <div class="message">
                Thiết bị sẽ khởi động lại sau
                <span id="countdown" class="count count-pulse">3</span> giây
            </div>
            <div class="sub">
                Vui lòng đợi trong khi hệ thống lưu và áp dụng cấu hình...
            </div>
            <div class="hint">
                Nếu trang không tự đóng, bạn có thể đóng cửa sổ này và chờ thiết bị kết nối lại Wi-Fi.
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function () {
            let count = 3;
            let countdownElement = document.getElementById('countdown');

            const timer = setInterval(function () {
                count--;
                countdownElement.textContent = count;

                if (count <= 0) {
                    clearInterval(timer);

                    fetch('/reboot', { method: 'POST' })
                        .then(response => {
                            if (response.ok) {
                                window.close();
                            }
                        })
                        .catch(() => {});
                }
            }, 1000);
        });
    </script>
